name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # needed to attach files to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (parses any .acreplay in the repo)
        run: python selftest.py

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name ACOvertakeFinder app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ACOvertakeFinder
          path: dist/ACOvertakeFinder.exe

      - name: Zip the in-game app
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path lua_app/OvertakeFocus -DestinationPath OvertakeFocus-ingame-app.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ACOvertakeFinder.exe
            OvertakeFocus-ingame-app.zip
          generate_release_notes: true
